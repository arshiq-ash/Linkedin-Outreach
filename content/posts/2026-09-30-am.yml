reference: "Breaking Bad: Walter White's obsession with process and purity"
status: approved
text: |
  Walter White was a terrible person with an excellent SOP.

  (Stick with me.)

  The whole show makes one thing clear. His product wasn't better because he was a genius. It was better because he refused to skip steps. Same process, same measurements, every batch, whoever was cooking.

  Jesse's batches were worse because Jesse improvised.

  Most support teams are full of Jesses. Talented, well-meaning people, all improvising:
  → 4 agents give 4 different answers to the same refund question
  → The "real" process lives in one senior agent's head
  → Quality depends on who picked up the ticket

  Consistency isn't a personality trait. It's documentation.

  Every account we take on starts the same way before a single ticket gets answered: Discover → Design → Deploy → Operate → Optimize. Workflows, macros and escalation paths get written down, so the 3rd agent we add gives the same answer as the 1st.

  Say my name? No thanks.
  Say the SOP version number instead.

  Who's the Jesse on your team? (Affectionately.)
hashtags: [CustomerExperience, Operations, SOP, BreakingBad, Startups]
