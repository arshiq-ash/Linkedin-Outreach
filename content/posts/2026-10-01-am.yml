text: |
  Could we BE any more understaffed?

  That was basically the brief when we started working with Silksilky, a DTC fashion brand.

  Where it started:
  • 1 person on support
  • Sizing questions, WISMO, returns, refunds and exchanges all in one inbox
  • Each email handled from scratch

  What we did (nothing glamorous):
  → Mapped every ticket type and wrote an SOP for each
  → Built macros inside Re:amaze and worked orders directly in Shopify admin
  → Added people only when the process could absorb them

  Where it is now:
  • A 6-person team, 24/7
  • 100–150 emails per person per day
  • Their Google rating moved from about 3.4 to 4.4 while we ran support

  To be honest about that last number: the rating moved because of the brand's product, marketing and fulfilment too. We were one part of it.

  But I've seen what happens to ratings when support is one exhausted person at 1am. The difference is real.

  What was the first support hire or process that changed things for your brand?
