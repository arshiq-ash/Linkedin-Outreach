text: |
  SERENITY NOW!

  Frank Costanza's doctor told him to yell it whenever his blood pressure spiked. It didn't work for Frank, and it won't work for your support team on Black Friday either.

  Here's what BFCM weekend chat actually looks like for a DTC clothing brand:
  → 9:02am: "Your discount code isn't working"
  → 9:04am: "Is the black hoodie coming back in medium?"
  → 9:05am: "If I order today, will it arrive before the 20th?"
  → 9:07am: "I got charged twice"
  → 9:10am: the same four questions, 60 more times

  Every one of these is a buying question. A customer who waits 2 hours for an answer about a discount code doesn't wait. They close the tab and buy somewhere else.

  What keeps a team calm (no yelling required):
  → Macros for the top 10 BFCM questions, ready before the sale goes live
  → A "known issues" note updated hourly, so agents know the code is broken before the 60th customer tells them
  → Extra trained agents on chat for the weekend, not people borrowed from the warehouse
  → A fast escalation path for payment problems

  Black Friday is November 27. The time to set this up is now, not Thursday night.

  What's the one BFCM question your team dreads most?
