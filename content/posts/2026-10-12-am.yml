status: approved    # draft -> approved -> posted
text: |
  Monica made three kinds of mashed potatoes for one Thanksgiving dinner.

  Lumpy. Smooth. With peas and onions.

  She knew her guests. Everyone wanted something different, at the same time.

  Your Q4 inbox works the same way. Between now and January, DTC customers show up wanting three very different things:

  🛍️ Before they buy: "Will this arrive before Christmas?" "Does it run true to size?" "Can you gift-wrap it?"
  📦 After they buy: "Where's my order?" (asked three times)
  🎁 After the holidays: "Can I exchange this gift?"

  Most brands prepare for one of these, usually WISMO. The pre-sales questions go unanswered and turn into abandoned carts. Then the January returns wave lands on a team that's already burnt out.

  Black Friday is November 27. That leaves about 6 weeks to:
  → Write macros for all three, not just tracking
  → Add seasonal agents now, so they're trained before the rush, not during it
  → Have shipping-cutoff answers and an exchange flow ready before customers ask

  We're taking on a few DTC brands for Q4: seasonal pre-sales and after-sales agents, trained on your products and tools, scaling back down in January. No long lock-in.

  Which one hits your inbox hardest: before, after, or after the holidays?
