text: |
  "Houston, we have a problem."

  Picture this. It's 10:47pm on Black Friday. A skincare founder gets a Slack message from her one support person:

  "The new discount code is stacking with the email code. Customers are getting 70% off. 400 orders and counting. Inbox is on fire."

  Then the questions start:
  → Do we cancel the orders or honour them?
  → What do we tell the customers who are already emailing?
  → Who's allowed to make that call at 11pm?

  Nobody knows. So nobody answers. By morning there are 900 tickets, and half of them say "I'm disputing this charge."

  In Apollo 13, the engineers on the ground had to make a square filter fit a round hole using only what was on the spacecraft. They solved it because they had a team, a process and someone clearly in charge.

  Q4 support needs the same thing before the problem shows up:
  → A crisis owner for BFCM weekend, with authority to decide
  → Pre-written messages for "pricing error", "out of stock" and "shipping delay"
  → Enough trained agents on shift to answer the first 500 emails in hours, not days

  You can't stop every problem. But you can decide in October who answers the call in November.

  What's the "Houston" moment you never want to repeat?
