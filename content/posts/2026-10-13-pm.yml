text: |
  Run the fire drill before the fire.

  Dwight's version in The Office (a real fire, locked doors, Stanley's heart attack) is what not to do. But the idea was right: find out how your team reacts under pressure before it matters.

  For DTC brands, that pressure is BFCM. Here's the support dry run we do with brands about 4 weeks out:

  1. Test every discount code on mobile and desktop, then write the macro for when one fails.
  2. Decide what agents say when a size sells out mid-sale, and which alternatives they offer.
  3. Confirm shipping cutoffs by carrier and region, and pin them in the helpdesk.
  4. Simulate a surge: send 50 test tickets in an hour and see where they pile up.
  5. Map escalations: who handles payment errors, fraud flags and VIP orders, and how fast.
  6. Staff for peak hours, not average hours. Chat spikes right after every promo email goes out.

  Two hours of rehearsal in October saves a weekend of chaos in November.

  We run this dry run for DTC brands and staff the seasonal pre-sales and after-sales team behind it. Scale up for BFCM, scale down in January, with no long lock-in.

  Which of the six would fail first at your brand?
