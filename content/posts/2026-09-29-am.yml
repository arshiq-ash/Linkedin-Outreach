text: |
  "I DECLARE BANKRUPTCY!"

  Michael Scott thought saying it out loud would make the debt disappear.

  A lot of clothing brands do the same thing after a big drop or sale. The inbox hits 800 tickets, someone bulk-closes half of them on a Friday, and everyone calls it a fresh start.

  But the customers are still there:
  → The one who ordered a medium and needs a large before the weekend
  → The one whose "delivered" parcel isn't on the doorstep
  → The one who's been waiting 9 days for a refund

  They don't stop waiting. They just stop emailing you and start writing reviews.

  For a DTC fashion brand we support, sizing questions, WISMO, returns, refunds and exchanges were all landing in one inbox with one person behind it.

  What changed things:
  → An SOP for every ticket type, starting with sizing and exchanges
  → Macros in the brand's voice, with orders handled directly in Shopify admin
  → Coverage that grew with demand: 1 person became a 6-person team running 24/7, each handling 100–150 emails a day

  No bankruptcy declared.

  Fashion founders: what piles up first after a big drop: sizing, WISMO or returns?
