text: |
  "I'll be back."

  Every gift you sell in December says it too.

  Picture this. Sarah buys a cashmere sweater for her dad on December 12th. It arrives on time. He opens it on the 25th. It's too small.

  On December 26th, Sarah is back. So are thousands of other customers, all at the same time:
  → "How do I exchange this for a large?"
  → "I didn't buy it. Can I still return it?"
  → "Can I get store credit instead?"

  If her email sits for five days, Sarah asks for a refund and buys the next gift somewhere else. If someone answers in an hour with an easy exchange, she ends up spending more.

  January returns aren't the end of Q4. They're the last part of it, and the best chance to keep the customer.

  How we help DTC brands get ready:
  → An exchange-first flow, so agents offer the right size before a refund
  → Macros for gift returns, store credit and holiday return windows
  → Seasonal agents who stay on through January, trained in October, so the people who sold in November also handle the returns

  The returns will be back. Make sure your team is too.

  DTC founders: what share of your holiday returns turn into exchanges?
